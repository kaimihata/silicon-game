name: Production specification

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            production-spec/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix production-spec

      - name: Build and test production specification
        run: |
          npm run build --prefix production-spec
          npm test --prefix production-spec
          npm run validate --prefix production-spec

      - name: Verify deterministic export and packet
        shell: bash
        run: |
          cd production-spec
          npm run clean -- --out generated
          npm run compile -- --out generated/ci-compiled
          source_sha="$(git rev-parse HEAD)"
          npm run export -- --out generated/ci-export --source-sha "$source_sha"
          cmp generated/ci-export/bundle.json fixtures/generated/game-spec-bundle-v1.json
          structural_target_sha="1111111111111111111111111111111111111111"
          npm run generate:packet -- --out generated/ci-packet.yaml --base-sha "$structural_target_sha"
          npm run validate:packet -- --file generated/ci-packet.yaml

      - name: Build and test browser prototype
        run: |
          npm test
          npm run build
