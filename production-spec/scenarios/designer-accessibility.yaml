schema_version: 1
id: designer-accessibility
version: 1
status: ready
title: Designer communicates choices and errors
milestone: playable-vertical-slice
environment: windows-reference
requirements:
  - req.slice.designer
seeds:
  - 5101
initial_state:
  fixture_id: designer-accessibility-initial-state
  label: Human test profile with accepted contract and blank linked design draft.
  inputs: [starter-catalog, default-qualifying-design]
execution_contract:
  setup_contract: fixture.setup.designer-accessibility
  runner_contract: runner.black-box-playtest
  command: "factory.verify.black-box-playtest --scenario designer-accessibility --fixture designer-accessibility-initial-state --seed {seed} --evidence-dir {evidence_dir}"
  semantic_api: ordinary_input_only
  verdict: pass only when setup state assertions pass, every declared scenario assertion evaluates true, budgets are not exceeded, every required evidence artifact validates and its digest is recorded, replay hash mismatch count is zero when replay evidence is required, and the runner exits zero; otherwise fail
player_knowledge:
  - Rendered frames
  - Accessibility semantics
  - Ordinary mouse and keyboard controls
goals:
  - assertion_id: assert.designer-accessibility.goal.01
    metric: published-eligible-designs
    operator: equal
    value: 1
  - assertion_id: assert.designer-accessibility.goal.02
    metric: unexplained-validation-errors
    operator: equal
    value: 0
invariants:
  - assertion_id: assert.designer-accessibility.invariant.01
    label: No semantic API
  - assertion_id: assert.designer-accessibility.invariant.02
    label: No oracle state
  - assertion_id: assert.designer-accessibility.invariant.03
    label: Color is never the only identification cue
budgets:
  simulation_minutes: 20
  player_commands: 300
required_behaviors:
  - assertion_id: assert.designer-accessibility.required_behavior.01
    label: Discover required families
  - assertion_id: assert.designer-accessibility.required_behavior.02
    label: Observe edge and thermal failure explanations
  - assertion_id: assert.designer-accessibility.required_behavior.03
    label: Use undo and redo
  - assertion_id: assert.designer-accessibility.required_behavior.04
    label: Compare supplier tiers
  - assertion_id: assert.designer-accessibility.required_behavior.05
    label: Publish a qualifying design
evidence:
  - black-box-recording
  - accessibility-snapshot
  - screenshots
