recipe_templates:
  - id: assembly-template
    stage: assembly
    capability: assemble-package
    input_bindings:
      - {port_id: input-1, source: design-compute-components}
      - {port_id: input-2, source: design-memory-components}
      - {port_id: input-3, source: design-io-components}
      - {port_id: input-4, source: design-power-components}
      - {port_id: input-5, source: substrate}
    pass_output: {port_id: output-1, kind: wip-unconnected}
    outcome_mode: deterministic
    setup_seconds: 2
    work_capacity_per_second: 2
    fixed_work: 1
    operating_cost_usd: 6
  - id: bonding-template
    stage: bonding
    capability: bond-connections
    input_bindings:
      - {port_id: input-1, source: prior-wip}
      - {port_id: input-2, source: connection-kits}
    pass_output: {port_id: output-1, kind: wip-bonded}
    outcome_mode: deterministic
    setup_seconds: 1.5
    work_capacity_per_second: 1.5
    fixed_work: 0
    operating_cost_usd: 5
  - id: inspection-template
    stage: inspection
    capability: inspect-package
    input_bindings:
      - {port_id: input-1, source: prior-wip}
    pass_output: {port_id: output-1, kind: wip-inspected}
    reject_output: {port_id: output-2, kind: reject-inspection}
    outcome_mode: exactly_one_seeded
    setup_seconds: 2
    work_capacity_per_second: 1.25
    fixed_work: 0
    operating_cost_usd: 7
  - id: test-template
    stage: test
    capability: test-package
    input_bindings:
      - {port_id: input-1, source: prior-wip}
    pass_output: {port_id: output-1, kind: wip-validated}
    reject_output: {port_id: output-2, kind: reject-test}
    outcome_mode: exactly_one_seeded
    setup_seconds: 2
    work_capacity_per_second: 1.5
    fixed_work: 0
    operating_cost_usd: 7
  - id: packaging-template
    stage: packaging
    capability: package-product
    input_bindings:
      - {port_id: input-1, source: prior-wip}
      - {port_id: input-2, source: selected-thermal-components}
      - {port_id: input-3, source: packaging-material}
    pass_output: {port_id: output-1, kind: product}
    outcome_mode: deterministic
    setup_seconds: 1
    work_capacity_per_second: 0.75
    fixed_work: 1
    operating_cost_usd: 5
outcome_algorithm:
  id: keyed-sha256-u53
  version: 1
  key_fields: [scenario_seed, product_unit_id, stage, outcome_version]
  canonical_key: UTF-8 JSON array in key_fields order using canonical decimal integers and lowercase stage IDs
  draw: Unsigned big-endian first 53 SHA-256 digest bits divided by 2^53
  decision: Reject exactly when draw is less than the stage reject probability; otherwise pass
contract:
  id: basic-display-1000
  name_key: contract.basic-display-1000
  product_id: product-display-100
  quantity: 1000
  unit_price_usd: 100
  minimum_quality: value
  requirements:
    - {id: sustained-compute, operator: greater_than_or_equal, value: 28, unit: rating}
    - {id: memory-capacity, operator: greater_than_or_equal, value: 1, unit: gb}
    - {id: memory-bandwidth, operator: greater_than_or_equal, value: 8, unit: gbps}
    - {id: display-pipelines, operator: greater_than_or_equal, value: 1, unit: count}
    - {id: package-power, operator: less_than_or_equal, value: 16, unit: watts}
balance:
  expected_yield: 0.9333
  material_cost_per_attempt_usd: 51
  operating_cost_per_attempt_usd: 30
  expected_cost_per_accepted_usd: 86.78
  expected_margin_percent: 13.22
  recommended_attempts: 1125
  reference_factory_capital_usd: 41500
  starting_cash_usd: 113707
