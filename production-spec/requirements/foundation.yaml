schema_version: 1
catalog_id: foundation-requirements
version: 1
status: ready
milestones:
  - id: technical-sandbox
    title: Technical sandbox
    owner: chip-city-owner
    depends_on: []
    checkpoint_required: false
requirements:
  - id: req.foundation.unity
    statement: The repository imports and builds with Unity 6000.3.23f1 and URP for both required targets.
    priority: must
    milestone: technical-sandbox
    source:
      specification: technical-architecture
      rule: exact-editor
    acceptance:
      - check_id: check.foundation.unity
        type: integration_test
        suite: build
    lifecycle: milestone
  - id: req.foundation.domain
    statement: Pure C# authoritative assemblies run headlessly and have no Unity rendering dependency.
    priority: must
    milestone: technical-sandbox
    source:
      specification: technical-architecture
      rule: pure-domain
    acceptance:
      - check_id: check.foundation.domain
        type: static_check
        suite: domain
    lifecycle: milestone
  - id: req.foundation.content
    statement: Safe YAML content validates, compiles to canonical runtime JSON, and reproduces its digest.
    priority: must
    milestone: technical-sandbox
    source:
      specification: content-catalog
      rule: yaml-source
    acceptance:
      - check_id: check.foundation.content
        type: schema
        suite: specification
    lifecycle: milestone
  - id: req.foundation.commands
    statement: Human, semantic, and replay adapters share typed atomic revision-aware command handlers.
    priority: must
    milestone: technical-sandbox
    source:
      specification: player-protocol
      rule: shared-handlers
    acceptance:
      - check_id: check.foundation.commands
        type: automated_test
        suite: protocol
    lifecycle: milestone
  - id: req.foundation.observations
    statement: Public observations are revisioned, delta-capable, player-visible, and free of oracle state.
    priority: must
    milestone: technical-sandbox
    source:
      specification: player-protocol
      rule: observations
    acceptance:
      - check_id: check.foundation.observations
        type: automated_test
        suite: protocol
    lifecycle: milestone
  - id: req.foundation.determinism
    statement: Fixed-tick seeded simulation and exact replay produce stable state hashes across speeds and adapters.
    priority: must
    milestone: technical-sandbox
    source:
      specification: deterministic-simulation
      rule: seeded-unit-outcomes
    acceptance:
      - check_id: check.foundation.determinism
        type: property_test
        suite: domain
    lifecycle: milestone
  - id: req.foundation.persistence
    statement: Versioned canonical saves migrate explicitly, write atomically, and recover from verified backup without reset.
    priority: must
    milestone: technical-sandbox
    source:
      specification: persistence
      rule: recovery
    acceptance:
      - check_id: check.foundation.persistence
        type: automated_test
        suite: persistence
    lifecycle: milestone
  - id: req.foundation.grid
    statement: Headless grid placement, rotated footprints, generic ports, directional routing, splitters, mergers, buffers, starvation, and blocking obey deterministic conservation rules.
    priority: must
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: belts
    acceptance:
      - check_id: check.foundation.grid
        type: property_test
        suite: domain
    lifecycle: milestone
  - id: req.foundation.design-revisions
    statement: Editable drafts publish immutable design revisions that compile exact revision-aware BOM and recipes.
    priority: must
    milestone: technical-sandbox
    source:
      specification: chip-design
      rule: publish-output
    acceptance:
      - check_id: check.foundation.design-revisions
        type: automated_test
        suite: domain
    lifecycle: milestone
  - id: req.foundation.multiple
    statement: Domain state represents multiple designs, products, recipes, and concurrent contracts without machine-global design assignment.
    priority: must
    milestone: technical-sandbox
    source:
      specification: game-context
      rule: first-scope
    acceptance:
      - check_id: check.foundation.multiple
        type: automated_test
        suite: domain
    lifecycle: milestone
  - id: req.foundation.semantic-chip
    statement: A semantic player configures a sandbox factory and produces one contract-eligible accepted chip using only public observations and commands.
    priority: must
    milestone: technical-sandbox
    source:
      specification: onboarding
      rule: sandbox-gate
    acceptance:
      - check_id: check.foundation.semantic-chip
        type: semantic_scenario
        suite: semantic-playtest
        scenario: sandbox-accepted-chip
    lifecycle: milestone
  - id: req.foundation.harness
    statement: A minimal rendered Unity harness exposes the same placement, routing, state, and command results as headless execution.
    priority: must
    milestone: technical-sandbox
    source:
      specification: technical-architecture
      rule: adapter-boundary
    acceptance:
      - check_id: check.foundation.harness
        type: integration_test
        suite: rendered-integration
    lifecycle: milestone
  - id: req.foundation.technical-architecture.external-content
    statement: Runtime content originates in external safe YAML validated against pinned schemas and compiled deterministically to canonical JSON; runtime does not interpret YAML.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: technical-architecture
      rule: external-content
    acceptance:
      - check_id: check.foundation.technical-architecture.external-content
        type: automated_test
        suite: domain
  - id: req.foundation.technical-architecture.ui-delegated
    statement: The Unity UI framework is an implementation choice only if interaction, accessibility, automated test, scaling, and performance contracts pass.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: technical-architecture
      rule: ui-delegated
    acceptance:
      - check_id: check.foundation.technical-architecture.ui-delegated
        type: automated_test
        suite: domain
  - id: req.foundation.technical-architecture.dependency-policy
    statement: Every dependency is pinned, maintained, license-allowed, scanned, justified, and introduces no new secret or paid service without human approval.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: technical-architecture
      rule: dependency-policy
    acceptance:
      - check_id: check.foundation.technical-architecture.dependency-policy
        type: asset_validation
        suite: asset-provenance
  - id: req.foundation.technical-architecture.local-only
    statement: Gameplay, saves, telemetry, and the semantic interface operate locally without external analytics, crash reporting, or required network service.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: technical-architecture
      rule: local-only
    acceptance:
      - check_id: check.foundation.technical-architecture.local-only
        type: automated_test
        suite: domain
  - id: req.foundation.technical-architecture.target-license
    statement: The target game repository source is licensed under MIT; third-party dependencies and assets retain their own recorded approved licenses and notices.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: technical-architecture
      rule: target-license
    acceptance:
      - check_id: check.foundation.technical-architecture.target-license
        type: integration_test
        suite: build
  - id: req.foundation.chip-design.lifecycle
    statement: A design is an editable draft until published; publication creates an immutable revision, and every redesign creates a new immutable revision under the same stable design ID.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: chip-design
      rule: lifecycle
    acceptance:
      - check_id: check.foundation.chip-design.lifecycle
        type: automated_test
        suite: domain
  - id: req.foundation.chip-design.identities
    statement: Contract-derived designs receive a stable contract-derived ID and default localized name; display names are editable and revisions are explicit.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: chip-design
      rule: identities
    acceptance:
      - check_id: check.foundation.chip-design.identities
        type: automated_test
        suite: domain
  - id: req.foundation.chip-design.association
    statement: Default flow creates a linked draft from a contract, while standalone design supports speculative designs and later contract association; internally valid designs may publish without a contract.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: chip-design
      rule: association
    acceptance:
      - check_id: check.foundation.chip-design.association
        type: automated_test
        suite: domain
  - id: req.foundation.chip-design.archive-delete
    statement: Archive and delete are manual and blocked while any contract, recipe, inventory, WIP, replay, or retained evidence references the design revision.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: chip-design
      rule: archive-delete
    acceptance:
      - check_id: check.foundation.chip-design.archive-delete
        type: automated_test
        suite: domain
  - id: req.foundation.chip-design.placement
    statement: Components occupy their rotated integer footprints on a zero-based top-left 6 by 6 substrate, cannot overlap or leave it, and the provisional maximum is eight components.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: chip-design
      rule: placement
    acceptance:
      - check_id: check.foundation.chip-design.placement
        type: automated_test
        suite: domain
  - id: req.foundation.chip-design.families
    statement: Component-family minimums and maximums are content data; onboarding requires compute, memory, power, thermal, at least one display I/O, a substrate, interconnects, and packaging material. Multiple instances in one family must use the same exact model while starter Assembler ports remain family-bound single-item inputs.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: chip-design
      rule: families
    acceptance:
      - check_id: check.foundation.chip-design.families
        type: automated_test
        suite: domain
  - id: req.foundation.chip-design.io-edge
    statement: Every required display I/O component touches a package edge.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: chip-design
      rule: io-edge
    acceptance:
      - check_id: check.foundation.chip-design.io-edge
        type: automated_test
        suite: domain
  - id: req.foundation.chip-design.thermal-adjacency
    statement: TH-110 is a draggable rotatable 2 by 1 part; every compute footprint must share an orthogonal edge with a spreader, and each spreader's 15 W capacity is shared among touching compute loads.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: chip-design
      rule: thermal-adjacency
    acceptance:
      - check_id: check.foundation.chip-design.thermal-adjacency
        type: automated_test
        suite: domain
  - id: req.foundation.chip-design.connections
    statement: The player selects Standard or Wide and drags compatible endpoints. Each endpoint anchor is the footprint cell nearest the other footprint by Manhattan distance, with topmost then leftmost tie-break. Breadth-first routing uses neighbor order east, south, west, north across in-bounds cells, may start/end on endpoint cells, cannot traverse another component, and may share or cross existing routes. Preview shows the resulting cell path, distance, capacity, power, material cost, bonding work, and inspection work before atomic creation.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: chip-design
      rule: connections
    acceptance:
      - check_id: check.foundation.chip-design.connections
        type: automated_test
        suite: domain
  - id: req.foundation.chip-design.route-congestion
    statement: For a route of distance d, distance efficiency is clamp from 0.4 to 1 of 1 minus 0.15 times max of zero and d minus 2. Effective route bandwidth is technology bandwidth times distance efficiency divided by the largest number of routes sharing any route cell. Bonding and inspection work are each multiplied by 1 plus 0.10 times the sum across its cells of max zero and route occupancy minus one.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: chip-design
      rule: route-congestion
    acceptance:
      - check_id: check.foundation.chip-design.route-congestion
        type: automated_test
        suite: domain
  - id: req.foundation.chip-design.undo-redo
    statement: Draft component, placement, rotation, connection, supplier-minimum, rename, and association edits support deterministic undo and redo.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: chip-design
      rule: undo-redo
    acceptance:
      - check_id: check.foundation.chip-design.undo-redo
        type: automated_test
        suite: domain
  - id: req.foundation.content-catalog.starter-models
    statement: Catalog includes CP-110, CP-130, MD-110, MD-130, IO-110, PM-110, TH-110, SUB-110, DL-110, DL-130, static PKG-MAT-100, and design-revision identity templates for WIP states, rejects, and PRODUCT-DISPLAY-100.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: content-catalog
      rule: starter-models
    acceptance:
      - check_id: check.foundation.content-catalog.starter-models
        type: schema
        suite: specification
  - id: req.foundation.content-catalog.alternatives
    statement: CP and MD alternatives are visible in the designer; every model changes product metrics, manufacturing work, cost, yield exposure, or multiple dimensions.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: content-catalog
      rule: alternatives
    acceptance:
      - check_id: check.foundation.content-catalog.alternatives
        type: schema
        suite: specification
  - id: req.foundation.content-catalog.default-offers
    statement: The default memory offer is PrimeMemory Premium MD-110 and the onboarding alternative is ValueMemory Value MD-110; all other required BOM items have a compatible default offer.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: content-catalog
      rule: default-offers
    acceptance:
      - check_id: check.foundation.content-catalog.default-offers
        type: schema
        suite: specification
  - id: req.foundation.content-catalog.quality-values
    statement: Current supplier prices and defect probabilities are promoted as provisional where available, with explicit inspection and test work multipliers added for each tier.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: content-catalog
      rule: quality-values
    acceptance:
      - check_id: check.foundation.content-catalog.quality-values
        type: schema
        suite: specification
  - id: req.foundation.content-catalog.localization
    statement: Content stores localization keys for player-facing name, description, guidance, state, and failure copy; IDs are never the sole player label.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: content-catalog
      rule: localization
    acceptance:
      - check_id: check.foundation.content-catalog.localization
        type: integration_test
        suite: rendered-integration
  - id: req.foundation.content-catalog.visual-semantics
    statement: Every family maps to a stable icon key, silhouette motif, accessible color token, and text label used in contracts, designer, procurement, docks, belts, recipes, alerts, and reports.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: content-catalog
      rule: visual-semantics
    acceptance:
      - check_id: check.foundation.content-catalog.visual-semantics
        type: integration_test
        suite: rendered-integration
  - id: req.foundation.content-catalog.generated-only
    statement: Generated runtime JSON and revision-specific compiled recipes are never hand-edited. The catalog stores universal stage recipe templates rather than CP-110 or MD-110 recipe instances, and generated provenance records source paths, compiler version, schema version, and digest.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: content-catalog
      rule: generated-only
    acceptance:
      - check_id: check.foundation.content-catalog.generated-only
        type: schema
        suite: specification
  - id: req.foundation.factory-logistics.fixed-endpoints
    statement: Preplaced edge receiving bays, one Shipping Dock, and one unlimited Scrap Collector are free, immovable, and nonremovable; onboarding auto-assigns one receiving stream per BOM item.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: fixed-endpoints
    acceptance:
      - check_id: check.foundation.factory-logistics.fixed-endpoints
        type: automated_test
        suite: domain
  - id: req.foundation.factory-logistics.belt-building
    statement: Dragging endpoints previews a deterministic default L path; release atomically builds the entire valid route or rejects it in red without charge, and alternate bends use multiple segments.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: belt-building
    acceptance:
      - check_id: check.foundation.factory-logistics.belt-building
        type: automated_test
        suite: domain
  - id: req.foundation.factory-logistics.splitter-merger
    statement: Splitters route single-item streams round-robin across unblocked outputs; mergers select the oldest waiting item with stable input-port order as a tie-break.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: splitter-merger
    acceptance:
      - check_id: check.foundation.factory-logistics.splitter-merger
        type: automated_test
        suite: domain
  - id: req.foundation.factory-logistics.recipe-identity
    statement: Machines are not globally tied to a design; an active recipe is compiled from universal stage templates, references one published immutable design revision, binds exact typed inputs to generic ports, and emits only WIP, product, or reject IDs carrying that revision identity.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: recipe-identity
    acceptance:
      - check_id: check.foundation.factory-logistics.recipe-identity
        type: automated_test
        suite: domain
  - id: req.foundation.factory-logistics.onboarding-autoconfigure
    statement: A newly placed onboarding machine auto-selects the sole compatible current-contract recipe and visibly shows it; zero or multiple compatible recipes leave it unconfigured.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: onboarding-autoconfigure
    acceptance:
      - check_id: check.foundation.factory-logistics.onboarding-autoconfigure
        type: automated_test
        suite: domain
  - id: req.foundation.factory-logistics.input-driven
    statement: A configured machine consumes a complete available input set whenever all required per-port buffers are ready, stops when any input is missing, and needs no production order.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: input-driven
    acceptance:
      - check_id: check.foundation.factory-logistics.input-driven
        type: automated_test
        suite: domain
  - id: req.foundation.factory-logistics.starter-ports
    statement: Starter ports are ASM five inputs and one output, BND two and one, INS one and two, TST one and two, and PKG three and one.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: starter-ports
    acceptance:
      - check_id: check.foundation.factory-logistics.starter-ports
        type: automated_test
        suite: domain
  - id: req.foundation.factory-logistics.immutable-wip
    statement: WIP carries immutable design-revision identity and accumulated source, lot, quality, input cost, operating cost, and processing history through every stage.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: immutable-wip
    acceptance:
      - check_id: check.foundation.factory-logistics.immutable-wip
        type: automated_test
        suite: domain
  - id: req.foundation.factory-logistics.recipe-switch
    statement: Switching recipe has no setup time or fee; after explicit confirmation it immediately scraps an in-process unit and incompatible buffered inputs, while incompatible incoming belt items stop at the port and may block.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: recipe-switch
    acceptance:
      - check_id: check.foundation.factory-logistics.recipe-switch
        type: automated_test
        suite: domain
  - id: req.foundation.factory-logistics.rejects
    statement: Only Quality Scanner and Chip Tester choose a reject outcome, each through its reject port; each consumed unit creates exactly one mutually exclusive pass or reject output. Scrap accepts unlimited items and logs type, reason, design revision, source metadata, and lost value.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: rejects
    acceptance:
      - check_id: check.foundation.factory-logistics.rejects
        type: automated_test
        suite: domain
  - id: req.foundation.factory-logistics.operating-state
    statement: Machines independently expose No recipe, Missing input or starved, Working, Output blocked, utilization, overload, and bottleneck contribution while incomplete factories may run.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: operating-state
    acceptance:
      - check_id: check.foundation.factory-logistics.operating-state
        type: automated_test
        suite: domain
  - id: req.foundation.factory-logistics.removal
    statement: Equipment removal is allowed only while paused, refunds full capital, and after confirmation scraps contained input, WIP, and output while preserving prior material and operating spend.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: removal
    acceptance:
      - check_id: check.foundation.factory-logistics.removal
        type: automated_test
        suite: domain
  - id: req.foundation.factory-logistics.collection
    statement: Holding the remappable collection action over a belt continuously collects advancing items; purchased inputs return to matching off-floor inventory, while WIP and finished goods require one confirmation per collection action and become logged scrap.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: factory-logistics
      rule: collection
    acceptance:
      - check_id: check.foundation.factory-logistics.collection
        type: automated_test
        suite: domain
  - id: req.foundation.persistence.logical-format
    statement: Logical save state is versioned canonical JSON with stable identifiers and explicit schema; future physical binary encoding may wrap but not redefine it.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: persistence
      rule: logical-format
    acceptance:
      - check_id: check.foundation.persistence.logical-format
        type: integration_test
        suite: persistence
  - id: req.foundation.persistence.migrations
    statement: Every supported prior save version has an explicit deterministic migration chain or a clear unsupported error; silent reinterpretation is prohibited.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: persistence
      rule: migrations
    acceptance:
      - check_id: check.foundation.persistence.migrations
        type: integration_test
        suite: persistence
  - id: req.foundation.persistence.atomic-autosave
    statement: Human state saves atomically after major decisions and every 60 seconds of active simulation time, retaining one last verified backup.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: persistence
      rule: atomic-autosave
    acceptance:
      - check_id: check.foundation.persistence.atomic-autosave
        type: integration_test
        suite: persistence
  - id: req.foundation.persistence.agent-isolation
    statement: Agent-test profiles use a separate namespace and storage root; the semantic service cannot enumerate, read, overwrite, migrate, or delete human saves.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: persistence
      rule: agent-isolation
    acceptance:
      - check_id: check.foundation.persistence.agent-isolation
        type: integration_test
        suite: persistence
  - id: req.foundation.persistence.agent-retention
    statement: Agents may reset or delete only their own profiles; retain the latest ten successful runs per scenario and all failed regressions unless manually pinned or deleted.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: persistence
      rule: agent-retention
    acceptance:
      - check_id: check.foundation.persistence.agent-retention
        type: integration_test
        suite: persistence
  - id: req.foundation.player-api.endpoints
    statement: GET endpoints are /api/v1/health, /api/v1/catalog, /api/v1/goals, /api/v1/observation with independent since_command_revision and after_event_sequence cursors, and /api/v1/profiles; mutations use the closed profile and command endpoints only.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: player-api
      rule: endpoints
    acceptance:
      - check_id: check.foundation.player-api.endpoints
        type: integration_test
        suite: protocol
  - id: req.foundation.player-api.command-envelope
    statement: Every command validates against the closed action-discriminated v1 wire schema with expected_command_revision; results separately report command_revision, simulation_tick, latest_event_sequence, closed effects/events, or a closed error.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: player-api
      rule: command-envelope
    acceptance:
      - check_id: check.foundation.player-api.command-envelope
        type: integration_test
        suite: protocol
  - id: req.foundation.player-api.simulation-actions
    statement: Simulation actions are set_speed with speed 0, 1, 2, or 4; save_now; and disconnect_agent. Headless stepping is test-harness-only and is not exposed to players.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: player-api
      rule: simulation-actions
    acceptance:
      - check_id: check.foundation.player-api.simulation-actions
        type: integration_test
        suite: protocol
  - id: req.foundation.player-api.contract-actions
    statement: Contract actions cover acceptance, linked design, immutable design/manufacturing-plan assignment, shipping priority, and explicit finished-inventory reserve, release, and reassignment; abandon is absent.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: player-api
      rule: contract-actions
    acceptance:
      - check_id: check.foundation.player-api.contract-actions
        type: integration_test
        suite: protocol
