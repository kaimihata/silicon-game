  - id: req.foundation.deterministic-simulation.fixed-tick
    statement: Authoritative simulation advances at exactly 10 fixed ticks per simulated second; pause, 1x, 2x, and 4x alter wall-time scheduling but never outcomes.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: deterministic-simulation
      rule: fixed-tick
    acceptance:
      - check_id: check.foundation.deterministic-simulation.fixed-tick
        type: automated_test
        suite: domain
  - id: req.foundation.deterministic-simulation.state-hash
    statement: Canonical authoritative state has a versioned hash algorithm and emits hashes at command and replay checkpoints.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: deterministic-simulation
      rule: state-hash
    acceptance:
      - check_id: check.foundation.deterministic-simulation.state-hash
        type: automated_test
        suite: domain
  - id: req.foundation.deterministic-simulation.formulas-product
    statement: Raw compute is sum of cores times GHz times architecture factor times 10; effective bandwidth follows graph paths and is limited by memory, links, distance and congestion; sustained compute is raw compute times min of one and bandwidth supply over demand.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: deterministic-simulation
      rule: formulas-product
    acceptance:
      - check_id: check.foundation.deterministic-simulation.formulas-product
        type: automated_test
        suite: domain
  - id: req.foundation.deterministic-simulation.formulas-power-thermal
    statement: Package power sums components and links; power delivery must cover load; each compute must touch thermal capacity, and shared spreader capacity is allocated across all touching compute.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: deterministic-simulation
      rule: formulas-power-thermal
    acceptance:
      - check_id: check.foundation.deterministic-simulation.formulas-power-thermal
        type: automated_test
        suite: domain
  - id: req.foundation.deterministic-simulation.workload-compile
    statement: A published immutable design revision compiles exact placement, bonding, inspection, test, and packaging workloads and stage recipes from component, route, quality, congestion, and thermal data; every compiled recipe and WIP or product type carries that revision identity.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: deterministic-simulation
      rule: workload-compile
    acceptance:
      - check_id: check.foundation.deterministic-simulation.workload-compile
        type: automated_test
        suite: domain
  - id: req.foundation.deterministic-simulation.yield-model
    statement: Each sourced component's base inspection and test work is multiplied by its quality tier before stage totals are calculated. Inspection reject probability is clamp from 0 to 0.25 of 0.006 plus quality-adjusted inspection workload times 0.0015 plus incoming defect exposure times 0.5; test reject probability is clamp from 0 to 0.30 of 0.01 plus quality-adjusted test workload times 0.0015 plus incoming defect exposure times 0.5 plus uncovered thermal watts times 0.008; total expected yield is both pass probabilities multiplied. Inspection and test are the only Milestone 2 reject stages.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: deterministic-simulation
      rule: yield-model
    acceptance:
      - check_id: check.foundation.deterministic-simulation.yield-model
        type: automated_test
        suite: domain
  - id: req.foundation.deterministic-simulation.machine-cycle
    statement: Per-unit cycle seconds equal stage setup seconds plus compiled stage workload divided by capacity; ASM is 2 and 2 units/s, BND 1.5 and 1.5, INS 2 and 1.25, TST 2 and 1.5, and PKG 1 and 0.75. Recipe operating cost is charged once for each active cycle that begins consuming inputs.
    priority: must
    lifecycle: milestone
    milestone: technical-sandbox
    source:
      specification: deterministic-simulation
      rule: machine-cycle
    acceptance:
      - check_id: check.foundation.deterministic-simulation.machine-cycle
        type: automated_test
        suite: domain
  - id: req.foundation.deterministic-simulation.accounting
